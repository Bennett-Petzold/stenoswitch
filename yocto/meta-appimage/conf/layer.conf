# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "appimage"
BBFILE_PATTERN_appimage = "^${LAYERDIR}/"
LAYERDEPENDS = "core"
LAYERVERSION_appimage = "1"
LAYERSERIES_COMPAT_appimage = "scarthgap"
