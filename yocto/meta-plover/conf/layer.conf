# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "plover"
BBFILE_PATTERN_plover = "^${LAYERDIR}/"
LAYERDEPENDS = "appimage"
LAYERVERSION_plover = "1"
LAYERSERIES_COMPAT_plover = "scarthgap"
